[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cassandra-terminal"
version = "0.1.0"
description = "A local-first developer workspace toolkit and terminal intelligence center (CassandraID-Terminal)."
readme = "README.md"
authors = [{ name = "CassandraID Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "platformdirs>=4.2.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
cassandra = "fileforge.cli.main:app"
cassandra-terminal = "fileforge.cli.main:app"
fileforge = "fileforge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["fileforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
